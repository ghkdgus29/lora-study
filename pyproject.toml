[project]
name = "lora-study"
version = "0.1.0"
description = "train_lora.py를 이해하기 위한 단계별 실습 (PyTorch -> 학습 루프 -> cross-entropy -> LLM -> chat template -> 답 토큰 loss -> LoRA -> 작은 SFT)"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.4",
    "transformers>=5.0",
    "peft>=0.18",
    "accelerate>=1.0",
    "matplotlib>=3.9",
]
